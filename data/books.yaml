- title: "Ex Machina"
  subtitle: "Essays on a Decade of Tech Policy"
  publisher: "Westland"
  year: 2026
  status: "In stores 28 September 2026 · available to pre-order"
  cover: "/books/ex-machina.jpg"
  description: |
    Essays from the first ten years of Ex Machina, arranged thematically to present the narrative arc of developments in Tech Policy in India on digital public infrastructure, map and drone reform, data protection and artificial intelligence.
